name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop

jobs:
  test-and-security:
    name: Test and security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web image
        run: docker compose build web

      - name: Prepare test database
        run: docker compose run --rm -e RAILS_ENV=test web bundle exec rails db:prepare

      - name: Run tests
        run: docker compose run --rm -e RAILS_ENV=test web bundle exec rails test

      - name: Ruby syntax check
        run: docker compose run --rm web sh -c 'find app config db test -name "*.rb" -print0 | xargs -0 -n1 ruby -c'

      - name: RuboCop lint
        run: docker compose run --rm web bundle exec rubocop --lint app config db test

      - name: Boot application and load routes
        run: |
          docker compose run --rm -e RAILS_ENV=test web bundle exec rails runner 'puts Rails.application.class.name'
          docker compose run --rm web bundle exec rails routes

      - name: Brakeman security scan
        run: docker compose run --rm web bundle exec brakeman --no-pager
