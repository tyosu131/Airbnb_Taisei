name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop

jobs:
  docker-checks:
    name: Docker checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web image
        run: docker compose build web

      - name: Ruby syntax checks
        run: |
          docker compose run --rm web ruby -c config/routes.rb
          docker compose run --rm web ruby -c app/controllers/properties_controller.rb
          docker compose run --rm web ruby -c app/controllers/host/properties_controller.rb
          docker compose run --rm web ruby -c app/controllers/host/images_controller.rb

      - name: Rails routes check
        run: docker compose run --rm web bundle exec rails routes
