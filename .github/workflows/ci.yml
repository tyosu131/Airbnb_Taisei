name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop

jobs:
  test-and-security:
    name: Test and security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web image
        run: docker compose build web

      - name: Prepare test database
        id: prepare
        run: docker compose run --rm -e RAILS_ENV=test web bundle exec rails db:prepare

      - name: Run tests
        id: tests
        continue-on-error: true
        run: docker compose run --rm -e RAILS_ENV=test web bundle exec rails test

      - name: Ruby syntax check
        id: syntax
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: docker compose run --rm web sh -c 'find app config db test -name "*.rb" -print0 | xargs -0 -n1 ruby -c'

      - name: RuboCop lint
        id: rubocop
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: docker compose run --rm web bundle exec rubocop --lint app config db test

      - name: Boot application
        id: boot
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: docker compose run --rm -e RAILS_ENV=test web bundle exec rails runner 'puts Rails.application.class.name'

      - name: Load routes
        id: routes
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: docker compose run --rm web bundle exec rails routes

      - name: Brakeman security scan
        id: brakeman
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: docker compose run --rm web bundle exec brakeman --no-pager --config-file config/brakeman.yml

      - name: Verify all checks passed
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          RUBOCOP_OUTCOME: ${{ steps.rubocop.outcome }}
          BOOT_OUTCOME: ${{ steps.boot.outcome }}
          ROUTES_OUTCOME: ${{ steps.routes.outcome }}
          BRAKEMAN_OUTCOME: ${{ steps.brakeman.outcome }}
        run: |
          failed=0
          for check in TESTS SYNTAX RUBOCOP BOOT ROUTES BRAKEMAN; do
            outcome_variable="${check}_OUTCOME"
            outcome="${!outcome_variable}"
            printf '%s: %s\n' "$check" "$outcome"
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
